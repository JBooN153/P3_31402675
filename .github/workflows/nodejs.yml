name: 🚀 CI/CD Pipeline - GitHub & Render

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name:  Checkout código fuente
        uses: actions/checkout@v4

      - name:  Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ===== BACKEND - API =====
      - name:  Instalar dependencias API
        working-directory: ./api/src
        run: npm ci --prefer-offline --no-audit

      - name:  Crear archivo .env API (testing)
        working-directory: ./api/src
        run: |
          cat > .env << EOF
          PORT=3000
          NODE_ENV=test
          DATABASE_PATH=./config/test_database.sqlite
          JWT_SECRET=${{ secrets.JWT_SECRET || 'test-secret-key-12345' }}
          TEST_DATABASE_PATH=:memory:
          FRONTEND_URL=http://localhost:5173
          PAYMENT_API_URL=https://fakepayment.onrender.com
          EOF

      - name:  Validar instalación de dependencias API
        working-directory: ./api/src
        run: npm list | head -20

      - name:  Ejecutar pruebas API
        working-directory: ./api/src
        run: npm test -- --passWithNoTests --forceExit --detectOpenHandles
        continue-on-error: true

      # ===== FRONTEND - WEB =====
      - name:  Instalar dependencias Web
        working-directory: ./web
        run: npm ci --prefer-offline --no-audit

      - name:  Crear archivo .env Web (production)
        working-directory: ./web
        run: |
          cat > .env << EOF
          VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          VITE_NODE_ENV=production
          EOF

      - name:  Validar instalación de dependencias Web
        working-directory: ./web
        run: npm list | head -20

      - name:  Construir Frontend
        working-directory: ./web
        run: npm run build

      - name:  Validar build de Frontend
        working-directory: ./web
        run: |
          if [ ! -d "dist" ]; then
            echo " Error: El directorio dist no fue creado"
            exit 1
          fi
          echo " Build completado exitosamente"

  # ===== DEPLOY A RENDER =====
  deploy-render:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name:  Checkout código fuente
        uses: actions/checkout@v4

      - name:  Deploy API a Render
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID_API }}
        run: |
          echo "🔄 Iniciando deployment de API..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_API }}/deploys)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo " Response: $BODY"
          
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo " API deployment initiated"
          else
            echo " API deployment warning: HTTP $HTTP_CODE"
          fi

      - name:  Deploy Web a Render
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID_WEB }}
        run: |
          echo " Iniciando deployment de Web..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_WEB }}/deploys)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo " Response: $BODY"
          
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo " Web deployment initiated"
          else
            echo " Web deployment warning: HTTP $HTTP_CODE"
          fi

      - name:  Aviso de Secrets
        if: ${{ !secrets.RENDER_API_KEY || !secrets.RENDER_SERVICE_ID_API || !secrets.RENDER_SERVICE_ID_WEB }}
        run: |
          echo "⚠️ ADVERTENCIA: No se configuraron los secrets de Render"
          echo "   - RENDER_API_KEY"
          echo "   - RENDER_SERVICE_ID_API"
          echo "   - RENDER_SERVICE_ID_WEB"
          echo "   Por favor, configura estos secrets en GitHub para habilitar el deploy automático"

      - name:  Pipeline completado
        run: echo " CI/CD Pipeline ejecutado exitosamente"
