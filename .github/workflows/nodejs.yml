name: 🚀 Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: ✅ Checkout código
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ===== BACKEND =====
      - name: 📥 Instalar dependencias Backend
        run: npm ci --legacy-peer-deps --prefer-offline
        continue-on-error: true

      - name: 🔧 Crear .env de testing
        run: |
          cat > .env << EOF
          PORT=3000
          NODE_ENV=test
          DATABASE_PATH=./config/test_database.sqlite
          JWT_SECRET=test-secret-key-12345
          TEST_DATABASE_PATH=:memory:
          FRONTEND_URL=http://localhost:5173
          PAYMENT_API_URL=https://fakepayment.onrender.com
          EOF

      - name: 🧪 Ejecutar tests Backend
        run: npm test -- --passWithNoTests --forceExit --detectOpenHandles
        continue-on-error: true

      # ===== FRONTEND =====
      - name: 📥 Instalar dependencias Frontend
        working-directory: ./web
        run: npm install --include=dev
        continue-on-error: true

      - name: 🔧 Crear .env Frontend
        working-directory: ./web
        run: |
          cat > .env << EOF
          VITE_API_PORT=10000
          VITE_NODE_ENV=production
          EOF

      - name: 🏗️ Build Frontend
        working-directory: ./web
        run: npm run build
        continue-on-error: true

      - name: ✅ Verificar build
        run: |
          if [ -d "public" ]; then
            echo "✓ Frontend build completado en public/"
            ls -la public | head -10
          else
            echo "❌ Build directory NOT found at public!"
            exit 1
          fi

  # ===== DEPLOY =====
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: ✅ Checkout código
        uses: actions/checkout@v4

      - name: 🚀 Deploy a Render (si está configurado)
        continue-on-error: true
        run: |
          if [ ! -z "${{ secrets.RENDER_API_KEY }}" ] && [ ! -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Iniciando deploy a Render..."
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys
            echo "Deploy iniciado"
          else
            echo "⚠ Secrets de Render no configurados"
          fi

      - name: ✅ Pipeline completado
        run: echo "✓ Build completado exitosamente"

