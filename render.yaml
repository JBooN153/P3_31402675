services:
  - type: web
    name: P3-31899312-App
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./config/database.sqlite
    routes:
      - path: /
        matchType: prefix
